[project]
name = "todo-cli"
version = "0.1.0"
description = "A simple in-memory CLI Todo application."
dependencies = [
    "typer>=0.9.0", # Minimum version compatible with Python 3.13+
]
requires-python = ">=3.13"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
"src.todo" = ["py.typed"] # For type checkers, if needed later
